<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte en Acción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfbf9;
            font-family: 'Arial Black', 'Impact', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* TÍTULO PRINCIPAL CENTRADO */
        .title-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.2s ease-in-out;
        }

        .title-container h1 {
            font-size: clamp(3rem, 8vw, 6.5rem);
            color: #000000;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1.1;
            font-weight: 900;
        }

        /* CUADROS EN LAS ESQUINAS */
        .art-frame {
            position: absolute;
            border: 8px solid #3a2a1d;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            background: #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-frame:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            z-index: 20;
        }

        /* 1. Esquina superior izquierda */
        .top-left {
            top: 4%;
            left: 3%;
            width: 210px;
            height: 170px;
            transform: rotate(-14deg);
            border-color: #8b5a2b;
        }

        /* 2. Esquina superior derecha */
        .top-right {
            top: 4%;
            right: 3%;
            width: 240px;
            height: 190px;
            transform: rotate(11deg);
            border-color: #d4af37;
        }

        /* 3. Esquina inferior izquierda (Mona Lisa) */
        .bottom-left {
            bottom: -2%;
            left: 2%;
            width: 170px;
            height: 230px;
            transform: rotate(-9deg);
            border-color: #1a1a1a;
        }

        /* 4. Esquina inferior derecha (Chica de la perla) */
        .bottom-right {
            bottom: -2%;
            right: 2%;
            width: 180px;
            height: 240px;
            transform: rotate(13deg);
            border-color: #c5a059;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Adaptación para móviles */
        @media (max-width: 768px) {
            .art-frame {
                width: 110px !important;
                height: 130px !important;
            }
        }
    </style>
</head>
<body>

    <!-- CUADRO ARRIBA IZQUIERDA -->
    <div class="art-frame top-left">
        <img src="https://picsum.photos/id/1025/400/300" alt="Arte Pinta">
    </div>

    <!-- CUADRO ARRIBA DERECHA -->
    <div class="art-frame top-right">
        <img src="https://picsum.photos/id/1062/400/300" alt="Flores Arte">
    </div>

    <!-- TÍTULO CENTRADO EXACTO -->
    <div class="title-container">
        <h1>ARTE<br>EN ACCIÓN</h1>
    </div>

    <!-- CUADRO ABAJO IZQUIERDA (MONA LISA) -->
    <div class="art-frame bottom-left">
        <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=400" alt="Mona Lisa">
    </div>

    <!-- CUADRO ABAJO DERECHA (LA JOVEN DE LA PERLA) -->
    <div class="art-frame bottom-right">
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=400" alt="La joven de la perla">
    </div>

</body>
</html>
