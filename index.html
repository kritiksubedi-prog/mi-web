<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte en Acción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfbf9;
            font-family: 'Arial Black', 'Impact', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* TÍTULO PRINCIPAL CENTRADO */
        .title-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.2s ease-in-out;
        }

        .title-container h1 {
            font-size: clamp(3.5rem, 9vw, 7rem);
            color: #000000;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1.05;
            font-weight: 900;
        }

        /* CUADROS EN LAS ESQUINAS */
        .art-frame {
            position: absolute;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-frame:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 20;
        }

        /* 1. Esquina superior izquierda */
        .top-left {
            top: 4%;
            left: 3%;
            width: 210px;
            height: 250px;
            transform: rotate(-14deg);
            border: 8px solid #8b5a2b;
        }

        /* 2. Esquina superior derecha */
        .top-right {
            top: 4%;
            right: 3%;
            width: 250px;
            height: 200px;
            transform: rotate(11deg);
            border: 8px solid #d4af37;
        }

        /* 3. Esquina inferior izquierda */
        .bottom-left {
            bottom: -2%;
            left: 2%;
            width: 190px;
            height: 270px;
            transform: rotate(-9deg);
            border: 8px solid #1a1a1a;
        }

        /* 4. Esquina inferior derecha */
        .bottom-right {
            bottom: -2%;
            right: 2%;
            width: 200px;
            height: 260px;
            transform: rotate(13deg);
            border: 8px solid #c5a059;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .art-frame {
                width: 120px !important;
                height: 150px !important;
            }
        }
    </style>
</head>
<body>

    <!-- 1. ARRIBA IZQUIERDA -->
    <div class="art-frame top-left">
        <img src="images.jpg" alt="Cuadro 1">
    </div>

    <!-- 2. ARRIBA DERECHA -->
    <div class="art-frame top-right">
        <img src="images (1).jpg" alt="Cuadro 2">
    </div>

    <!-- TÍTULO CENTRADO EXACTO -->
    <div class="title-container">
        <h1>ARTE<br>EN ACCIÓN</h1>
    </div>

    <!-- 3. ABAJO IZQUIERDA -->
    <div class="art-frame bottom-left">
        <img src="images (2).jpg" alt="Cuadro 3">
    </div>

    <!-- 4. ABAJO DERECHA -->
    <div class="art-frame bottom-right">
        <img src="images (3).jpg" alt="Cuadro 4">
    </div>

</body>
</html>
