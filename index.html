<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte en Acción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfbf9;
            font-family: 'Arial Black', 'Impact', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* TÍTULO PRINCIPAL CENTRADO */
        .title-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        .title-container h1 {
            font-size: clamp(3rem, 8vw, 6.5rem);
            color: #000000;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1.1;
            font-weight: 900;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* CUADROS EN LAS ESQUINAS */
        .art-frame {
            position: absolute;
            border: 8px solid #3a2a1d;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            background: #fff;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: float 4s ease-in-out infinite alternate;
        }

        .art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-frame:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 20;
        }

        /* 1. Esquina superior izquierda */
        .top-left {
            top: 5%;
            left: 3%;
            width: 220px;
            height: 180px;
            transform: rotate(-15deg);
            border-color: #8b5a2b;
        }

        /* 2. Esquina superior derecha */
        .top-right {
            top: 5%;
            right: 3%;
            width: 260px;
            height: 200px;
            transform: rotate(12deg);
            border-color: #d4af37;
            animation-delay: 1s;
        }

        /* 3. Esquina inferior izquierda (Mona Lisa) */
        .bottom-left {
            bottom: -2%;
            left: 2%;
            width: 180px;
            height: 240px;
            transform: rotate(-10deg);
            border: 4px solid #1a1a1a;
            animation-delay: 2s;
        }

        /* 4. Esquina inferior derecha (Chica de la perla) */
        .bottom-right {
            bottom: -2%;
            right: 2%;
            width: 200px;
            height: 260px;
            transform: rotate(14deg);
            border-color: #c5a059;
            animation-delay: 1.5s;
        }

        /* ANIMACIONES */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0% { translateY(0px); }
            100% { translateY(-10px); }
        }

        /* Adaptación para móviles */
        @media (max-width: 768px) {
            .art-frame {
                width: 120px !important;
                height: 140px !important;
            }
        }
    </style>
</head>
<body>

    <!-- CUADRO ARRIBA IZQUIERDA -->
    <div class="art-frame top-left">
        <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500" alt="Arte Expresionista">
    </div>

    <!-- CUADRO ARRIBA DERECHA -->
    <div class="art-frame top-right">
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=500" alt="Paisaje Artístico">
    </div>

    <!-- TÍTULO CENTRADO EXACTO -->
    <div class="title-container">
        <h1>ARTE<br>EN ACCIÓN</h1>
    </div>

    <!-- CUADRO ABAJO IZQUIERDA (MONA LISA) -->
    <div class="art-frame bottom-left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/405px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg" alt="Mona Lisa">
    </div>

    <!-- CUADRO ABAJO DERECHA (LA JOVEN DE LA PERLA) -->
    <div class="art-frame bottom-right">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/400px-1665_Girl_with_a_Pearl_Earring.jpg" alt="La joven de la perla">
    </div>

</body>
</html>
