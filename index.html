<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte en Acción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfbf9;
            font-family: 'Arial Black', 'Impact', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* TÍTULO PRINCIPAL CENTRADO */
        .title-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.2s ease-in-out;
        }

        .title-container h1 {
            font-size: clamp(3rem, 8vw, 6.5rem);
            color: #000000;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1.1;
            font-weight: 900;
        }

        /* CUADROS EN LAS ESQUINAS */
        .art-frame {
            position: absolute;
            border: 8px solid #3a2a1d;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            background: #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-frame:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            z-index: 20;
        }

        /* 1. Esquina superior izquierda (El Grito) */
        .top-left {
            top: 4%;
            left: 3%;
            width: 190px;
            height: 230px;
            transform: rotate(-14deg);
            border-color: #8b5a2b;
        }

        /* 2. Esquina superior derecha (La Noche Estrellada) */
        .top-right {
            top: 4%;
            right: 3%;
            width: 240px;
            height: 190px;
            transform: rotate(11deg);
            border-color: #d4af37;
        }

        /* 3. Esquina inferior izquierda (Mona Lisa) */
        .bottom-left {
            bottom: -2%;
            left: 2%;
            width: 170px;
            height: 240px;
            transform: rotate(-9deg);
            border-color: #1a1a1a;
        }

        /* 4. Esquina inferior derecha (La Joven de la Perla) */
        .bottom-right {
            bottom: -2%;
            right: 2%;
            width: 180px;
            height: 240px;
            transform: rotate(13deg);
            border-color: #c5a059;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Adaptación para móviles */
        @media (max-width: 768px) {
            .art-frame {
                width: 110px !important;
                height: 140px !important;
            }
        }
    </style>
</head>
<body>

    <!-- CUADRO ARRIBA IZQUIERDA (El Grito - Munch) -->
    <div class="art-frame top-left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73.5_cm%2C_National_Gallery_of_Norway.jpg/400px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73.5_cm%2C_National_Gallery_of_Norway.jpg" alt="El Grito">
    </div>

    <!-- CUADRO ARRIBA DERECHA (La Noche Estrellada - Van Gogh) -->
    <div class="art-frame top-right">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/450px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" alt="La Noche Estrellada">
    </div>

    <!-- TÍTULO CENTRADO EXACTO -->
    <div class="title-container">
        <h1>ARTE<br>EN ACCIÓN</h1>
    </div>

    <!-- CUADRO ABAJO IZQUIERDA (Mona Lisa - Da Vinci) -->
    <div class="art-frame bottom-left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/300px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg" alt="Mona Lisa">
    </div>

    <!-- CUADRO ABAJO DERECHA (La Joven de la Perla - Vermeer) -->
    <div class="art-frame bottom-right">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/300px-1665_Girl_with_a_Pearl_Earring.jpg" alt="La joven de la perla">
    </div>

</body>
</html>
